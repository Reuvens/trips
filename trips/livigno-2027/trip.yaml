    reuvenTrackHe: "גלישת בוקר חזקה על מסלולים אדומים ושחורים ב-Mottolino וב-Carosello 3000; מיום רביעי גלישת אחה״צ משותפת עם הבנות על כחולים ארוכים."
    girlsTrackHe: "חימום בוקר קליל, שיעור קבוצתי {{ dates.courseHoursText }} ב-Scuola Sci Centrale ממש ליד הבית, ואחה״צ תרגול כיפי או קניות במדרחוב."
    oritTrackHe: "בקרים רגועים של בריכות אדים חמות וסאונות פנורמיות ב-Aquagranda, טיול שמש למחלבת Latteria ועלייה בגונדולה לתצפית הפסגה."
    meetupHe: "כל יום ב-13:05 במרפסת Tagliede/Centrale בסיום הקורס — וביום שמש בהיר מפגש פסגה ב-Carosello 3000 או במחלבת Latteria!"
  - id: "day-sat-return"
