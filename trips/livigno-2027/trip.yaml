    reuvenTrackHe: "איסוף הקבוצה במלפנסה, קבלת מפתחות ב-{{ firstNight.name }} ובדיקת מיקום חנות Sport4U ובית הספר Centrale במדרחוב."
    girlsTrackHe: "מנוחה מטיסת הלילה, סיבוב היכרות ראשון בשלג ובחנויות של ליביניו וארוחת פיצות מוקדמת."
    oritTrackHe: "התמקמות רגועה ב-{{ firstNight.name }}, קפה איטלקי ראשון מול הפסגות ושינה מוקדמת לפני שבוע החופשה."
    meetupHe: "כל החמישה יחד כל היום — ארוחת ערב ראשונה ורגועה קרוב ל-Via Li Caprena."
