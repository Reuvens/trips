    summaryHe: "בזמן שכל האלפים עומדים בפקקי השבת, אתם כבר בתוך העמק! משאירים מזוודות ב-Appartamenti Calanda, אוספים ציוד ב-Sport4U הצמודה וחונכים את המנוי ל-{{ dates.skiDays }} ימים."
    reuvenTrackHe: "סיוע לבנות בהתאמת נעליים וקסדות ב-Sport4U, שעה משותפת על מסלול המתחילים ואז גיחה ראשונה לפסגות."
