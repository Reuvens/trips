    - id: "advanced"
      weight: 1
      labelHe: "ראובן"
      whatHe: "שטח אמיתי ומגוון לגולש מנוסה בזמן שהבנות בקורס"
    - id: "snow"
      weight: 2
      labelHe: "ביטחון שלג בסוף פברואר"
      whatHe: "גובה הכפר והפסגות, כיוון מדרונות וכיסוי השלגה מלאכותית"
  scores:
    livigno:
      beginners:
        n: 5
        whyHe: "כחולים רחבים וגבוהים בשני צדי העמק, 70% השלגה מלאכותית וקורס ראשון–שישי צמוד לדירה"
      non_skier:
        n: 5
        whyHe: "ספא Aquagranda, מדרחוב עם 250 חנויות פטורות ממכס, החלקה על קרח ואוטובוס חינם — הכפר העשיר מכולם"
      evening:
        n: 5
        whyHe: "העיירה החיה והתוססת משלושת האתרים — בתי קפה, חנויות פתוחות ואנשים ברחוב בערב"
      transfer:
        n: 3
        whyHe: "3:45 לכיוון (הארוך מהשלושה), אך עם טיסות אל על הוא נופל על שישי בצהריים ושבת אחה״צ בלי לפגוע בימי הסקי"
      advanced:
        n: 3
        whyHe: "שני רכסים, פארק שלג אולימפי ופרירייד נחמד ב-Mottolino — מהנה לשבוע, פחות תלול מצרוויניה/ססטרייר"
      snow:
        n: 5
        whyHe: "כפר בגובה 1,816 מ׳, פסגות ב-2,900 מ׳ ובסיס שלג בשיא העובי בסוף פברואר"
    cervinia:
      beginners:
        n: 5
        whyHe: "Plan Maison נחשב מאזורי הלימוד הטובים באלפים, עם כחולים ארוכים ומתונים (בכפוף לרוחות)"
      non_skier:
        n: 3
        whyHe: "כפר קטן יחסית, אך כולל מעבר רכבל ייחודי לצרמט בשווייץ גם ללא מגלשיים"
      evening:
        n: 3
        whyHe: "אפרה-סקי נעים ומסעדות טובות — פחות שוקק מליביניו, יותר חי מססטרייר"
      transfer:
        n: 5
        whyHe: "כ-2:15 ממלפנסה — הנסיעה הקצרה והנוחה ביותר משדה התעופה"
      advanced:
        n: 4
        whyHe: "ירידות ארוכות מאוד מ-3,480 מ׳ ואפשרות הרחבה ל-360 ק״מ עם צרמט"
      snow:
        n: 5
        whyHe: "כפר ב-2,050 מ׳ וקרחון עד 3,480 מ׳ — השלג הבטוח ביותר באיטליה"
    sestriere:
      beginners:
        n: 4
        whyHe: "שטח כחול נוח סביב הכפר הגבוה עצמו, קרוב לפתח המגורים"
      non_skier:
        n: 3
        whyHe: "כפר פונקציונלי משנות ה-70 — יש בריכה, ספא וכמה בוטיקים, אך פחות קסם אלפיני לאורית"
      evening:
        n: 3
        whyHe: "רגוע באמצע השבוע ומתעורר בעיקר בסופי שבוע עם גולשים מטורינו"
      transfer:
        n: 4
        whyHe: "כ-2:45 ממלפנסה רובו על אוטוסטרדה נוחה"
      advanced:
        n: 5
        whyHe: "400 ק״מ מסלולים מחוברים ויום כלול בצרפת — המרחב הגדול ביותר לראובן"
      snow:
        n: 4
        whyHe: "כפר גבוה (2,035 מ׳), אך חיבורים נמוכים ופונים דרום עם כיסוי השלגה חלקי"

